<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aibyn</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* фоновые падающие полосы */
.line {
  position: absolute;
  top: -100px;
  width: 2px;
  height: 100px;
  background: linear-gradient(pink, transparent);
  animation: fall linear infinite;
  opacity: 0.7;
}

@keyframes fall {
  0% { transform: translateY(-100px); }
  100% { transform: translateY(120vh); }
}

/* центр текст */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: #ff4fd8;
  font-size: 40px;
  text-shadow: 0 0 10px pink, 0 0 30px purple;
  opacity: 0;
  animation: fadeIn 3s forwards 2s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* сердце canvas */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<div class="center-text">HAPPY BIRTHDAY TO AIBYN</div>

<canvas id="heart"></canvas>

<script>
// ===== падающие линии =====
for(let i=0;i<60;i++){
  let line=document.createElement("div");
  line.className="line";
  line.style.left=Math.random()*window.innerWidth+"px";
  line.style.animationDuration=(1+Math.random()*2)+"s";
  line.style.height=(50+Math.random()*150)+"px";
  document.body.appendChild(line);
}

// ===== сердце из частиц =====
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function heartFunction(t){
  return [
    16*Math.pow(Math.sin(t),3),
    -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  ];
}

for(let i=0;i<800;i++){
  let t = Math.random()*Math.PI*2;
  let pos = heartFunction(t);

  particles.push({
    x: canvas.width/2 + pos[0]*10,
    y: canvas.height/2 + pos[1]*10,
    vx: 0,
    vy: 0,
    size: Math.random()*2.5,
    alpha: 0,
    targetAlpha: 1
  });
}

function animate(){
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    ctx.fillStyle = `rgba(255,105,180,${p.targetAlpha})`;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
